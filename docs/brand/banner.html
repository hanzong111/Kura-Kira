<!doctype html>
<!-- Source of readme-banner.png. Rebuild: serve the repo root (python3 -m http.server) and screenshot
     #banner at 2x with any headless browser. Uses the DUIT Co-op Arcade pack in dashboard/web/duit/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kura-Kira banner</title>
<link rel="stylesheet" href="../../dashboard/web/duit/css/duit.css">
<style>
  body { margin: 0; background: var(--du-bg); }
  #banner { position: relative; width: 820px; height: 240px; overflow: hidden; background: var(--du-bg);
            border-bottom: 6px solid var(--du-coral); }
  #banner::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
                   background: repeating-linear-gradient(90deg, var(--du-yellow) 0 24px, var(--du-coral) 24px 48px); }
  .sky { position: absolute; right: 0; top: 18px; width: 384px; height: 64px; image-rendering: pixelated; }
  h1 { position: absolute; left: 40px; top: 44px; margin: 0; color: var(--du-surface); font: 40px/1 var(--du-pixel);
       letter-spacing: 2px; text-shadow: 4px 4px 0 var(--du-coral); }
  p { position: absolute; left: 42px; top: 112px; margin: 0; color: var(--du-surface); font: 600 17px/1.5 var(--du-mono); }
  p span { color: var(--du-yellow); }
  .party { position: absolute; right: 40px; bottom: 22px; display: flex; align-items: flex-end; }
  .party img { width: 128px; height: 128px; image-rendering: pixelated; margin-left: -28px; }
  .tags { position: absolute; left: 42px; bottom: 34px; display: flex; gap: 10px; }
  .tags span { padding: 4px 8px; border: 2px solid var(--du-ink); box-shadow: 3px 3px 0 #000; color: var(--du-ink);
               font: 600 13px/1.2 var(--du-mono); }
</style>
</head>
<body>
<div id="banner">
  <img class="sky" src="../../dashboard/web/duit/assets/scene/skyline@2x.png" alt="">
  <h1>KURA-KIRA</h1>
  <p>Spending for two, kept by a bot<br>in your <span>Telegram group</span>.</p>
  <div class="tags">
    <span style="background:var(--du-coral)">P1 Hanz</span>
    <span style="background:var(--du-teal)">P2 Vanisa</span>
    <span style="background:var(--du-yellow)">RM, to the sen</span>
  </div>
  <div class="party">
    <img src="../../dashboard/web/duit/assets/sprites/hanz/idle-00.png" alt="">
    <img src="../../dashboard/web/duit/assets/sprites/chuchu/idle-00.png" alt="">
    <img src="../../dashboard/web/duit/assets/sprites/vanisa/idle-00.png" alt="">
  </div>
</div>
</body>
</html>
