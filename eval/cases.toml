expect = { kind = "fixed", person = "hanz", bills = ["house", "car"] }

[[case]]
id = "settle"
sender = "vanisa"
text = "vanisa paid hanz 14.50"
expect = { kind = "settle", from = "vanisa", to = "hanz", amount = 14.50 }

[[case]]
id = "how-are-we"
