# ---- answers to questions ----------------------------------------------------------------------
[[case]]
id = "answer-payer"
after = "split-no-payer"
sender = "hanz"
text = "hanz paid"
reply_to_bot = true
expect = { kind = "answer", paid_by = "hanz" }

[[case]]
id = "answer-bucket-casual"
after = "ambiguous-bucket"
sender = "vanisa"
text = "sport lah, for badminton"
reply_to_bot = true
expect = { kind = "answer", bucket = "daily", category = "Sport" }

[[case]]
id = "answer-each"
after = "shared-no-payer"
sender = "vanisa"
text = "each paid own"
reply_to_bot = true
expect = { kind = "answer", paid_by = "each" }

