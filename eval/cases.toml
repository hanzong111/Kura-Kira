# Parsing test set: real-style group messages and what the ledger must end up with.
# The eval sends each message to the agent (fresh ledger per case unless `after` is set) and checks the
# resulting entry. Fields under `expect` are checked only when present.
#
# expect.kind:
#   "spend"   - one entry logged; check place/amount/shares/paid_by/bucket/category/needs
#   "ask"     - nothing logged; the agent must ask (e.g. amount missing)
#   "ignore"  - not a spend; nothing logged and no reply needed
#   "answer"  - resolves the pending entry created by the `after` case
#   "fixed"   - marks a fixed bill paid
#   "settle"  - records a settle-up
#   "status"  - read-only question; nothing logged
# bucket "daily" means weekday or weekend, whichever matches today's date.
# place is matched loosely (case/spaces/punctuation ignored, either contains the other).

# ---- the formats from the plan -----------------------------------------------------------------
[[case]]
id = "colon-amount"
sender = "hanz"
text = "lunch : RM56.50"
expect = { kind = "spend", place = "lunch", amount = 56.50, shares = { hanz = 56.50 }, paid_by = "hanz", bucket = "daily", category = "Food" }

[[case]]
id = "place-category-parens"
sender = "hanz"
text = "Sushi-Mentai ( food ) : 56.50"
expect = { kind = "spend", place = "Sushi-Mentai", amount = 56.50, paid_by = "hanz", bucket = "daily", category = "Food" }

[[case]]
id = "comma-separated"
sender = "vanisa"
text = "sushimentai , food , 26.20"
expect = { kind = "spend", place = "sushi mentai", amount = 26.20, shares = { vanisa = 26.20 }, paid_by = "vanisa", bucket = "daily", category = "Food" }

[[case]]
id = "split-with-payer"
sender = "hanz"
text = "zapfan , lunch , RM13.20 hanz , 14.50 vanisa , Hanz paid"
expect = { kind = "spend", place = "zapfan", amount = 27.70, shares = { hanz = 13.20, vanisa = 14.50 }, paid_by = "hanz", bucket = "daily", category = "Food" }

[[case]]
id = "split-no-payer"
sender = "vanisa"
text = "zapfan lunch 13.20 hanz 14.50 vanisa"
expect = { kind = "spend", amount = 27.70, shares = { hanz = 13.20, vanisa = 14.50 }, needs = ["payer"], asked = true }

[[case]]
id = "split-even"
sender = "hanz"
text = "sushi mentai 80 split, vanisa paid"
expect = { kind = "spend", amount = 80, shares = { hanz = 40, vanisa = 40 }, paid_by = "vanisa", bucket = "daily" }

[[case]]
id = "split-ratio"
sender = "vanisa"
text = "dinner 60 split 2:1 hanz paid"
expect = { kind = "spend", amount = 60, shares = { hanz = 40, vanisa = 20 }, paid_by = "hanz" }

[[case]]
id = "for-other-person"
sender = "hanz"
text = "grab 25 for vanisa, hanz paid"
expect = { kind = "spend", amount = 25, shares = { vanisa = 25 }, paid_by = "hanz", category = "Transport" }

[[case]]
id = "shared-no-payer"
sender = "vanisa"
text = "jaya grocer 120 shared"
expect = { kind = "spend", amount = 120, shares = { hanz = 60, vanisa = 60 }, bucket = "grocery", needs = ["payer"], asked = true }

[[case]]
id = "each-paid-own"
sender = "hanz"
text = "mamak 10 me 12 vanisa, each paid own"
expect = { kind = "spend", amount = 22, shares = { hanz = 10, vanisa = 12 }, paid_by = "each" }

